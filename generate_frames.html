<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GatorCorp - Render Seat Frames</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { background: #111; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        canvas { border: 1px solid #333; margin: 20px; background: transparent; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #222; color: white; border: 1px solid #444; }
        button:hover { background: #333; }
        #status { margin-top: 20px; color: #aaa; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <h1>Seat Frame Generator</h1>
    <p>This script will load your 3D Seat, spin it 360 degrees, and generate 60 transparent PNG frames.</p>
    <button id="renderBtn">Render & Download ZIP</button>
    <div id="status">Waiting to load model...</div>
    <canvas id="preview"></canvas>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        const canvas = document.getElementById('preview');
        // Standardize resolution for sequence
        const WIDTH = 800;
        const HEIGHT = 800;
        
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(WIDTH, HEIGHT);
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, WIDTH / HEIGHT, 0.1, 1000);
        camera.position.set(0, 2, 18);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);

        let seatModel;
        const status = document.getElementById('status');

        gltfLoader.loadAsync('/assets/Seat_draco.glb').then(gltf => {
            seatModel = gltf.scene;
            
            const seatBox = new THREE.Box3().setFromObject(seatModel);
            const seatSize = seatBox.getSize(new THREE.Vector3());
            const seatCenter = seatBox.getCenter(new THREE.Vector3());
            const seatScale = 10 / seatSize.y; 
            seatModel.scale.set(seatScale, seatScale, seatScale);
            seatModel.position.set(-seatCenter.x * seatScale, -seatCenter.y * seatScale, -seatCenter.z * seatScale);
            
            scene.add(seatModel);
            renderer.render(scene, camera);
            status.innerText = "Model loaded. Ready to render.";
        });

        document.getElementById('renderBtn').addEventListener('click', async () => {
            if(!seatModel) return;
            status.innerText = "Rendering frames... please wait.";
            
            const zip = new JSZip();
            const folder = zip.folder("seat_sequence");
            const frames = 60;
            
            for(let i=0; i<frames; i++) {
                // Spin seat
                seatModel.rotation.y = (Math.PI * 2) * (i / frames);
                renderer.render(scene, camera);
                
                // Get image data
                const dataUrl = canvas.toDataURL("image/png");
                const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");
                
                // Add to zip
                const filename = seat_.png;
                folder.file(filename, base64Data, {base64: true});
            }
            
            status.innerText = "Zipping files... this may take a few seconds.";
            
            const content = await zip.generateAsync({type:"blob"});
            const url = URL.createObjectURL(content);
            const a = document.createElement("a");
            a.href = url;
            a.download = "seat_sequence.zip";
            a.click();
            URL.revokeObjectURL(url);
            
            status.innerText = "Done! Extract the ZIP and place the images in /public/assets/seat_sequence/";
        });
    </script>
</body>
</html>
