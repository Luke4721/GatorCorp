<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Apple-Style Sequence (Ultra Smooth)</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { border: 1px solid #333; margin-bottom: 20px; background: transparent; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Generating 90 Ultra-Smooth Frames (Front & Left Only)</h2>
    <canvas id="render-canvas"></canvas>
    <button id="download-btn" disabled>Loading Model...</button>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <!-- Use JSZip from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        const canvas = document.getElementById('render-canvas');
        const btn = document.getElementById('download-btn');

        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(800, 800);
        renderer.setPixelRatio(2);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
        camera.position.set(0, 1, 5); 
        camera.lookAt(0, 0, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(2, 5, 5);
        scene.add(dirLight);

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);

        let seatModel;
        const framesToGenerate = 90;
        const frames = [];

        gltfLoader.load('/assets/Seat_draco.glb', (gltf) => {
            seatModel = gltf.scene;
            
            const box = new THREE.Box3().setFromObject(seatModel);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            const scale = 3.5 / size.y; 
            seatModel.scale.set(scale, scale, scale);
            seatModel.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
            
            const group = new THREE.Group();
            group.add(seatModel);
            scene.add(group);

            renderer.render(scene, camera);
            
            btn.textContent = "Generate 90 Frames";
            btn.disabled = false;

            btn.onclick = async () => {
                btn.textContent = "Generating... Please wait";
                btn.disabled = true;

                for (let i = 0; i < framesToGenerate; i++) {
                    // Sweep from front (0) to left (-Math.PI/2) and slightly back. 
                    // Let's do a sine wave sweep so it naturally slows down at the edges!
                    // Math.sin ranges from -1 to 1.
                    // Let's sweep from 0 (front) to -Math.PI / 1.5 (left side).
                    
                    const progress = i / (framesToGenerate - 1);
                    // Use a curve so it sweeps left, then comes back to front
                    // progress goes 0 to 1
                    // angle goes from 0 -> -Math.PI/1.5 -> 0
                    const angle = Math.sin(progress * Math.PI) * (-Math.PI / 1.2);
                    
                    group.rotation.y = angle;
                    
                    renderer.render(scene, camera);
                    
                    const dataUrl = canvas.toDataURL('image/png');
                    frames.push({ name: `seat_${(i + 1).toString().padStart(4, '0')}.png`, data: dataUrl.split(',')[1] });
                    
                    await new Promise(r => setTimeout(r, 50));
                }

                btn.textContent = "Zipping frames...";
                
                const zip = new JSZip();
                frames.forEach(f => zip.file(f.name, f.data, {base64: true}));
                
                zip.generateAsync({type:"blob"}).then(function(content) {
                    saveAs(content, "seat_sequence_90.zip");
                    btn.textContent = "Done! Extract to public/assets/seat_sequence";
                });
            };
        });
    </script>
</body>
</html>
