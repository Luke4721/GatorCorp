<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GatorCorp | Built for Endurance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #0d0d0d;
        color: #ffffff;
        overflow-x: hidden;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- The master scroll container used for Lenis height -->
    <div id="scroll-container" class="h-[1200vh]">
      
      <!-- ERA RESIDENCE 1:1 HERO -->
      <section id="era-hero" class="fixed inset-0 z-40 w-full h-screen overflow-hidden bg-[#0d0d0d] flex flex-col justify-between pointer-events-none">
          <!-- High Res Industrial/Rock Background from Unsplash -->
          <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=100&w=2800&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-50 mix-blend-screen pointer-events-none" style="filter: contrast(1.2) brightness(0.8);" />
          
          <nav class="relative z-20 w-full p-8 flex justify-between items-start pointer-events-auto mix-blend-difference text-white">
              <div class="relative w-32 h-32 flex items-center justify-center animate-[spin_20s_linear_infinite]">
                  <svg viewBox="0 0 100 100" class="absolute inset-0 w-full h-full overflow-visible">
                      <path id="sealPath" d="M 50, 50 m -40, 0 a 40,40 0 1,1 80,0 a 40,40 0 1,1 -80,0" fill="none" />
                      <text class="text-[10px] font-bold tracking-[0.2em] uppercase" fill="white">
                          <textPath href="#sealPath" startOffset="0%">GATORCORP • SEATING • GATORCORP • SEATING • </textPath>
                      </text>
                  </svg>
                  <div class="w-3 h-3 bg-white/40 rounded-full"></div>
              </div>
              <div class="flex items-center gap-4 cursor-pointer group">
                  <span class="font-bold tracking-[0.3em] text-[10px] group-hover:opacity-60 transition-opacity uppercase">Menu</span>
                  <div class="flex flex-col gap-1.5">
                      <div class="w-1 h-1 bg-white rounded-full"></div>
                      <div class="w-1 h-1 bg-white rounded-full"></div>
                      <div class="w-1 h-1 bg-white rounded-full"></div>
                  </div>
              </div>
          </nav>

          <div class="absolute inset-0 z-10 flex items-center justify-center pointer-events-none mix-blend-difference">
              <div id="hero-circle-1" class="absolute w-[80vh] h-[80vh] border-[0.5px] border-white/20 rounded-full scale-110"></div>
              <div id="hero-circle-2" class="absolute w-[90vh] h-[90vh] border-[0.5px] border-white/10 rounded-full scale-110"></div>
              
              <div class="relative text-center flex flex-col items-center" id="hero-typography">
                  <h1 class="text-[14vw] font-['Playfair_Display'] leading-[0.8] text-white tracking-[-0.03em] mx-auto z-10 mt-10">
                      GATOR<br/>CORP
                  </h1>
                  <!-- Moved the cursive text below so it doesn't overlap messily -->
                  
              </div>
          </div>

          <div class="relative z-20 w-full flex justify-between items-end px-12 pb-10 pointer-events-none mix-blend-difference" id="hero-split-text">
              <h3 id="hero-split-left" class="text-[5vw] font-['Playfair_Display'] leading-none text-white tracking-tight">BUILT FOR</h3>
              <h3 id="hero-split-right" class="text-[5vw] font-['Playfair_Display'] leading-none text-white tracking-tight">ENDURANCE</h3>
          </div>
      </section>

      <!-- SECTION: HEART AEROSPACE WHITE VIDEO (TRANSITION TO CATALOGUE) -->
      <div id="section-ha-white" class="fixed inset-0 z-[41] bg-[#f4f4f5] opacity-0 overflow-hidden pointer-events-none flex items-center justify-center">
         <!-- Replacing the muddy drone video with a clean, high-res Unsplash texture -->
         <img src="https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=100&w=2800&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover z-0 opacity-40 mix-blend-multiply" />
         <div class="relative z-10 w-full max-w-7xl mx-auto px-10 text-center">
            <h2 id="ha-text-white" class="text-[6vw] font-['Playfair_Display'] leading-[1.1] tracking-tight text-[#111] transform scale-90 opacity-0 italic">
               The ultimate<br/>luxury is isolation.
            </h2>
         </div>
      </div>

      <!-- SECTION 4: CATALOGUE REVEAL (ERA STYLE) -->
      <div id="catalogue-ui" class="fixed inset-0 z-[42] flex flex-col justify-end p-6 md:p-10 pointer-events-auto bg-[#0d0d0d] opacity-0 pointer-events-none translate-y-[20vh]">
        <main class="flex-1 w-full flex items-center justify-center relative mt-10">
          <div class="absolute inset-0 flex justify-center items-center pointer-events-none z-10 pt-10">
              <div class="relative inline-block h-[75vh]">
                  <img id="cat-img" src="/assets/seats/Supremo.png" class="h-full w-auto object-contain drop-shadow-2xl" />
                  <div id="hotspots-container" class="absolute inset-0 pointer-events-none"></div>
              </div>
          </div>
          <div class="absolute right-10 bottom-32 w-80 z-20 pointer-events-auto flex flex-col gap-4">
              <div class="flex flex-col border-b border-white/20 pb-4">
                  <span class="font-['Great_Vibes'] text-4xl text-white/70 mb-[-10px] ml-1">Series</span>
                  <span id="cat-title" class="font-['Playfair_Display'] text-5xl font-bold text-white tracking-wide">SUPREMO</span>
              </div>
              <p id="cat-desc" class="text-[10px] font-sans font-light leading-relaxed text-white/70 tracking-widest uppercase">
                  Supremo is a premium offering with top-of-the-line air suspension. It guarantees the absolute ultimate in long-haul comfort and vibration isolation for highway driving.
              </p>
          </div>
        </main>
        <footer class="w-full flex justify-between items-end pb-2 pointer-events-auto px-4">
             <div id="pixel-swap-container" class="cursor-pointer z-40 border-[0.5px] border-white/40 rounded-full text-white overflow-hidden flex items-center justify-center text-[10px] tracking-[0.2em] uppercase hover:bg-white hover:text-black transition-colors" style="width: 240px; height: 48px;"></div>
             <div class="z-40 pointer-events-auto flex items-center gap-6">
               <div class="text-[10px] font-bold tracking-[0.3em] text-white/40 uppercase">SELECT MODEL</div>
               <div id="carousel-container" class="flex gap-4 items-center"></div>
           </div>
        </footer>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
