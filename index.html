<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GatorCorp - The Backbone of Industry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="preloader" data-preloader>
    <div class="preloader__bar" data-preloader-bar></div>
  </div>

  <canvas id="bg"></canvas>
  
  <div id="scroll-container">
    <section class="hero">
      <div class="hero-content">
        <h1 class="left-text">GATOR</h1>
        <h1 class="right-text">CORP</h1>
      </div>
      <p class="scroll-prompt">Scroll to explore</p>
    </section>

    <section class="truck-arrival">
      <div class="specs-content specs-left">
        <h3 class="spec-label">Chassis Design</h3>
        <p class="spec-value">Heavy-Duty</p>
        <h3 class="spec-label">Payload Capacity</h3>
        <p class="spec-value">120,000 lbs</p>
      </div>
      
      <div class="specs-content specs-right">
        <h3 class="spec-label">Suspension</h3>
        <p class="spec-value">Active Air-Ride</p>
        <h3 class="spec-label">Drive</h3>
        <p class="spec-value">All-Wheel 6x6</p>
      </div>
    </section>

    <section class="roof-breach"></section>

    <section class="diorama-section" id="diorama-section">
      <div class="diorama-container" id="diorama">
        <h2 class="diorama-title">Unrivaled Comfort.</h2>
        <div class="diorama-scene">
          <!-- Sliced elements for Idea 3 (2.5D Diorama) -->
          <img src="/assets/seat-base.png" class="diorama-layer base-layer" data-speed="-0.08" alt="Seat Base">
          <img src="/assets/seat-cushion.png" class="diorama-layer cushion-layer" data-speed="0" alt="Seat Cushion">
          <img src="/assets/seat-back.png" class="diorama-layer backrest-layer" data-speed="0.05" alt="Seat Backrest">
        </div>
        <p class="diorama-caption">Hover to explore the physics of comfort.</p>
        <br/>
        <a href="#" class="cta-btn diorama-cta">View Product Catalog</a>
      </div>
    </section>

    <footer class="footer">
      <h2>Experience GatorCorp.</h2>
    </footer>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
